<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">How Sol AI answers a question about the open page</title>
  <desc id="desc">Your question goes to ChatGPT on your own plan. ChatGPT asks Sol to run tools on the live tab: read the page, search it, read a linked page, highlight a passage. Sol returns the results and ChatGPT writes the answer. Clicking, typing and navigating wait for your approval.</desc>

  <rect width="1200" height="460" rx="28" fill="#0d0f13"/>
  <rect x="1" y="1" width="1198" height="458" rx="27" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="78" fill="#f4f4f5" font-size="40" font-weight="700">Sol AI</text>
    <text x="196" y="78" fill="#a1a1aa" font-size="24">works on the live page, with your ChatGPT plan</text>
  </g>

  <g id="flow" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- 1. Question -->
    <rect x="56" y="128" width="236" height="132" rx="20" fill="#181b21" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="80" y="170" fill="#a1a1aa" font-size="18" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">YOU ASK</text>
    <text x="80" y="208" fill="#f4f4f5" font-size="22">“How do I install</text>
    <text x="80" y="236" fill="#f4f4f5" font-size="22">the CLI?”</text>

    <path d="M300 194h44" stroke="#4c8dff" stroke-width="3"/>
    <path d="M340 186l12 8-12 8z" fill="#4c8dff"/>

    <!-- 2. ChatGPT -->
    <rect x="360" y="128" width="236" height="132" rx="20" fill="#181b21" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="384" y="170" fill="#a1a1aa" font-size="18" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">CHATGPT</text>
    <text x="384" y="208" fill="#f4f4f5" font-size="22">Your Plus or Pro</text>
    <text x="384" y="236" fill="#f4f4f5" font-size="22">plan, no API key</text>

    <!-- tool calls loop -->
    <path d="M478 268v46" stroke="#4c8dff" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M470 310l8 12 8-12z" fill="#4c8dff"/>
    <text x="496" y="300" fill="#8fb4ff" font-size="18">calls tools</text>

    <!-- 3. Tools run by Sol on the open tab -->
    <rect x="56" y="330" width="852" height="88" rx="20" fill="#121a2b" stroke="#4c8dff" stroke-opacity=".45"/>
    <text x="80" y="364" fill="#8fb4ff" font-size="18" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">SOL, ON THE OPEN TAB</text>
    <g font-size="21" fill="#e4e4e7">
      <text x="80" y="398">Read the page</text>
      <text x="262" y="398">·  Search it</text>
      <text x="402" y="398">·  Follow a link</text>
      <text x="578" y="398">·  Highlight the passage</text>
    </g>

    <path d="M620 194h44" stroke="#4c8dff" stroke-width="3"/>
    <path d="M660 186l12 8-12 8z" fill="#4c8dff"/>

    <!-- 4. Answer -->
    <rect x="680" y="128" width="228" height="132" rx="20" fill="#181b21" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="704" y="170" fill="#a1a1aa" font-size="18" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">ANSWER</text>
    <text x="704" y="208" fill="#f4f4f5" font-size="22">Streams in, with</text>
    <text x="704" y="236" fill="#f4f4f5" font-size="22">the pages used</text>

    <!-- approval gate -->
    <rect x="936" y="128" width="208" height="290" rx="20" fill="#1c1710" stroke="#f5b14c" stroke-opacity=".55"/>
    <text x="960" y="170" fill="#f5b14c" font-size="18" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">YOUR APPROVAL</text>
    <g font-size="21" fill="#f4f4f5">
      <text x="960" y="210">Click</text>
      <text x="960" y="240">Type in a field</text>
      <text x="960" y="270">Open an address</text>
    </g>
    <g font-size="18" fill="#c8b48f">
      <text x="960" y="318">Nothing changes</text>
      <text x="960" y="342">on a site until</text>
      <text x="960" y="366">you allow it.</text>
    </g>
    <rect x="960" y="382" width="92" height="22" rx="11" fill="#f5b14c" fill-opacity=".9"/>
    <text x="977" y="398" fill="#1c1710" font-size="16" font-weight="700">Allow</text>
  </g>
</svg>
