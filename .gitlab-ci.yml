# Tests on merge requests; a tag such as v0.1.0 builds the three Windows architectures, uploads the installers,
# the archives and their checksums to the package registry, and creates the GitLab release that links to them.
# Sol reads those release links to update itself.
stages: [test, release]

.windows:
  tags: [saas-windows-medium-amd64]
  before_script:
    - $ErrorActionPreference = 'Stop'
    - Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:TEMP\dotnet-install.ps1"
    - '& "$env:TEMP\dotnet-install.ps1" -Channel 10.0 -InstallDir "$env:CI_PROJECT_DIR\.dotnet"'
    - $env:DOTNET_ROOT = "$env:CI_PROJECT_DIR\.dotnet"
    - $env:PATH = "$env:DOTNET_ROOT;$env:USERPROFILE\.dotnet\tools;$env:PATH"
    - if (-not (Get-Command node -ErrorAction SilentlyContinue)) { choco install nodejs-lts -y --no-progress; $env:PATH = "$env:ProgramFiles\nodejs;$env:PATH" }
    - if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) { dotnet tool install -g PowerShell }
    - Push-Location ui; npm ci; if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }; Pop-Location

test:
  extends: .windows
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - Push-Location ui; npm run build; if ($LASTEXITCODE -ne 0) { throw 'interface build failed' }; Pop-Location
    - dotnet test tests/Browser.Core.Tests -c Release --nologo; if ($LASTEXITCODE -ne 0) { throw 'tests failed' }
    - dotnet build src/Browser.App -c Release --nologo; if ($LASTEXITCODE -ne 0) { throw 'build failed' }

release:
  extends: .windows
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  script:
    - $version = ([xml](Get-Content src/Browser.App/Browser.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
    - if ("v$version" -ne $env:CI_COMMIT_TAG) { throw "Tag $env:CI_COMMIT_TAG does not match project version $version" }
    - dotnet tool install -g vpk --version 1.2.161
    - pwsh -NoProfile -File tools/publish.ps1 -Arch x64,arm64,x86 -Out release; if ($LASTEXITCODE -ne 0) { throw 'publish failed' }
    # Installers, archives, checksums, and what the updater needs (packages and their release index).
    - $files = @(Get-ChildItem release/*.zip, release/*-Setup.exe, release/SHA256SUMS.txt, release/installer/*.nupkg, release/installer/releases.*.json)
    - $headers = @{ 'JOB-TOKEN' = $env:CI_JOB_TOKEN }
    - $base = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/sol/$version"
    - foreach ($f in $files) { Invoke-RestMethod -Method Put -InFile $f.FullName -Headers $headers -Uri "$base/$($f.Name)" | Out-Null }
    - $links = @($files | ForEach-Object { @{ name = $_.Name; url = "$base/$($_.Name)"; link_type = 'package' } })
    - $body = @{ tag_name = $env:CI_COMMIT_TAG; name = $env:CI_COMMIT_TAG; description = "Sol $version"; assets = @{ links = $links } } | ConvertTo-Json -Depth 5
    - Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/releases" | Out-Null
