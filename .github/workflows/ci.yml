name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Interface
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Tests
        run: dotnet test tests/Browser.Core.Tests -c Release --nologo

      - name: Build
        run: dotnet build src/Browser.App -c Release --nologo
