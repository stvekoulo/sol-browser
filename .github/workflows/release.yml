name: Release

# Pushing a tag such as v0.1.0 builds the three Windows architectures, attaches the archives and their
# checksums to a GitHub release, and records a build provenance attestation for each archive.
on:
  push:
    tags: ['v*']

permissions:
  contents: write       # create the release
  id-token: write       # sign the provenance attestation
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: The tag must match the project version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/Browser.App/Browser.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match project version $version" }

      - name: Interface dependencies
        working-directory: ui
        run: npm ci

      - name: Publish x64, ARM64 and x86
        shell: pwsh
        run: ./tools/publish.ps1 -Arch x64,arm64,x86 -Out release

      # Free alternative to a paid code-signing certificate: anyone can check that an archive was built
      # by this workflow, from this repository, with `gh attestation verify`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.zip

      - name: GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem release/*.zip) release/SHA256SUMS.txt --title "${{ github.ref_name }}" --generate-notes
